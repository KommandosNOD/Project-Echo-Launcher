name: Build PROJECT ECHO Builder 0.7.1 (Windows)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Extract Builder 0.7.1 source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = 'source/ProjectEcho_LauncherBuilder_v0.7.1_SOURCE.zip'
          if (!(Test-Path -LiteralPath $zip)) { throw 'Missing Builder 0.7.1 SOURCE ZIP in source/.' }
          Expand-Archive -LiteralPath $zip -DestinationPath 'working' -Force
          $proj = 'working/ProjectEcho_LauncherBuilder_v0.7.1/ProjectEcho.Builder.csproj'
          if (!(Test-Path -LiteralPath $proj)) { throw 'Builder source project not found in ZIP.' }
          [xml]$xml = Get-Content -LiteralPath $proj -Raw
          $v = ($xml.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          if ($v -ne '0.7.1') { throw "Unexpected Builder version: $v" }
      - name: Build Builder Windows x64
        shell: pwsh
        run: |
          dotnet publish 'working/ProjectEcho_LauncherBuilder_v0.7.1/ProjectEcho.Builder.csproj' -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:PublishTrimmed=false -p:NuGetAudit=false -o dist-builder
          if ($LASTEXITCODE -ne 0) { throw 'Builder compile error.' }
          if (!(Test-Path 'dist-builder/ProjectEcho.Builder.exe')) { throw 'Builder EXE missing.' }
      - name: Upload Builder package (all DLLs together)
        uses: actions/upload-artifact@v4
        with:
          name: PROJECT-ECHO-Builder-0.7.1-Windows-x64
          path: dist-builder/
          if-no-files-found: error
          retention-days: 14
